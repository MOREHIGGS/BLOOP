name: Ruff Linter
on:
  pull_request:
    branches: [ "main" ]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ruff
        run: pip install ruff
      - name: ruff version 
        run: ruff --version
      - name: Run Ruff
        run: ruff check Source/
